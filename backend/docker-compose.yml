version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: threat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: threat_intel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d threat_intel"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: threat_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/threatpassword
      NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "threatpassword", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Optional backend container if you want Docker to run the API as well
  # api:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: threat_api
  #   restart: unless-stopped
  #   ports:
  #     - "8000:8000"
  #   environment:
  #     DATABASE_URL: "postgresql+psycopg2://postgres:postgrespassword@postgres:5432/threat_intel"
  #     NEO4J_URI: "bolt://neo4j:7687"
  #     NEO4J_USER: "neo4j"
  #     NEO4J_PASSWORD: "threatpassword"
  #     SECRET_KEY: "change_this_to_a_secure_random_key"
  #     ALGORITHM: "HS256"
  #     ACCESS_TOKEN_EXPIRE_MINUTES: "120"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     neo4j:
  #       condition: service_healthy

volumes:
  pgdata:
  neo4jdata: