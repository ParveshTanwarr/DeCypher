x-backend-common: &backend-common
  build:
    context: ..
    dockerfile: backend/Dockerfile
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgresql+psycopg2://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}@postgres:5432/threat_intel
    NEO4J_URI: bolt://neo4j:7687
    NEO4J_USER: neo4j
    NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in backend/.env}
    REDIS_URL: redis://redis:6379/0
    CELERY_RESULT_BACKEND: redis://redis:6379/1
  depends_on:
    postgres:
      condition: service_healthy
    # Neo4j is an optional graph projection: the API has a PostgreSQL fallback.
    # Do not prevent API/worker startup when Neo4j auth or availability is degraded.
    neo4j:
      condition: service_started
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:15-alpine
    container_name: threat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
      POSTGRES_DB: threat_intel
    ports: ["127.0.0.1:5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$POSTGRES_PASSWORD psql -h postgres -U postgres -d threat_intel -v ON_ERROR_STOP=1 -Atqc 'SELECT 1' | grep -qx 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  neo4j:
    image: neo4j:5-community
    container_name: threat_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in backend/.env}
      NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
    # Bind local development ports to this machine only.
    ports: ["127.0.0.1:7474:7474", "127.0.0.1:7687:7687"]
    volumes: [neo4jdata:/data]
    healthcheck:
      test: ["CMD", "cypher-shell", "-a", "bolt://localhost:7687", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in backend/.env}", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  redis:
    image: redis:7-alpine
    container_name: threat_redis
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    <<: *backend-common
    container_name: threat_api
    restart: unless-stopped
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
        ]
      interval: 15s
      timeout: 5s
      retries: 10

  celery_worker:
    <<: *backend-common
    container_name: threat_celery_worker
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "worker", "--loglevel=info"]

  celery_beat:
    <<: *backend-common
    container_name: threat_celery_beat
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.celery_app.celery_app", "beat", "--loglevel=info"]

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: threat_prometheus
    restart: unless-stopped
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ../infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    depends_on:
      api:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle

  grafana:
    image: grafana/grafana:12.1.1
    container_name: threat_grafana
    restart: unless-stopped
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in backend/.env}
    volumes:
      - grafanadata:/var/lib/grafana
      - ../infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started

volumes:
  pgdata:
  neo4jdata:
  prometheusdata:
  grafanadata:
