version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: threat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: threat_intel
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d threat_intel"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: threat_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/threatpassword
      NEO4J_PLUGINS: '["graph-data-science", "apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
    ports: ["7474:7474", "7687:7687"]
    volumes: [neo4jdata:/data]
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "threatpassword", "RETURN 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  celery_worker:
    image: python:3.11-slim
    container_name: threat_celery_worker
    working_dir: /app
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      celery -A app.workers.celery_app.celery_app worker --loglevel=info"

  celery_beat:
    image: python:3.11-slim
    container_name: threat_celery_beat
    working_dir: /app
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
      celery -A app.workers.celery_app.celery_app beat --loglevel=info"

  redis:
    image: redis:7-alpine
    container_name: threat_redis
    restart: unless-stopped
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  neo4jdata:
